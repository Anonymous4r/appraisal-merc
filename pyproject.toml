[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erc-engine"
version = "0.1.0"
description = "Layered emotion-recognition pipeline for IEMOCAP and MELD"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.scripts]
erc = "erc_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

